# docker-compose.yml for Burmese Banking RAG Service
# Single-container setup with embedded ChromaDB and pre-downloaded Qwen3 model

services:
  rag-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: burmese-bank-rag-service
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Ensure the service binds to all interfaces inside the container
      - HOST=0.0.0.0
      - PORT=8000
    volumes:
      # Persist ChromaDB vector store data
      - chroma_data:/app/data/chroma_db
      # Mount knowledge base (so ingested docs persist and can be edited)
      - ./knowledge:/app/knowledge
      # Mount logs
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  chroma_data: